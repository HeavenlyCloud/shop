<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>🛒 Shopping Helper</h1>

  <div class="controls">
    <select id="currency" onchange="updateCurrency()">
      <option value="$">$ NTD</option>
      <option value="₱">₱ PHP</option>
      <option value="¥">¥ JPY</option>
    </select>

    <input id="budget" type="number" placeholder="Budget (optional)">
  </div>

  <div class="input-row">
    <input id="name" placeholder="Product">
    <input id="qty" type="number" min="1" placeholder="Qty">
    <input id="price" type="number" min="0" step="0.01" placeholder="Price">
    <button onclick="addItem()">Add</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <div class="summary">
    <label>
      <input type="checkbox" id="taxToggle" onchange="updateGrandTotal()"> Add 12% Tax
    </label>

    <h2 id="grandTotal">Total: $0.00</h2>
  </div>

  <button class="danger" onclick="resetList()">🗑 Clear All</button>
</div>

<script src="script.js"></script>
</body>
</html>
