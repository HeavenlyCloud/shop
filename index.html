<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1>🛒 Shopping Helper</h1>

    <div class="input-row">
      <input id="name" placeholder="Product name">
      <input id="qty" type="number" min="1" placeholder="Qty">
      <input id="price" type="number" min="0" step="0.01" placeholder="Price">
      <button onclick="addItem()">Add</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <button class="danger" onclick="resetList()">🗑️ Clear All</button>

    <h2 class="grand-total">
      Grand Total: ₱<span id="grandTotal">0.00</span>
    </h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
